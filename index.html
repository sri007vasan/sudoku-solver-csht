<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Stopwatch & Timer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0f172a; color: #fff; font-family: monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .timer-card { background: #1e293b; border-radius: 20px; padding: 2.5rem; text-align: center; border: 1px solid #334155; max-width: 400px; width: 100%; }
    .timer-display { font-size: 3.5rem; font-weight: bold; color: #34d399; margin: 1.5rem 0; background: #090d16; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="timer-card">
    <h2 class="h4 text-indigo-400 font-sans font-bold">⏱️ Precision Stopwatch</h2>
    <div id="timer-display" class="timer-display">00:00:00</div>
    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-success font-sans font-bold flex-1" onclick="startTimer()">Start</button>
      <button class="btn btn-warning font-sans font-bold flex-1" onclick="pauseTimer()">Pause</button>
      <button class="btn btn-danger font-sans font-bold flex-1" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    let seconds = 0;
    let timerId = null;

    function updateTime() {
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer-display').textContent = hrs + ':' + mins + ':' + secs;
    }

    function startTimer() {
      if (!timerId) {
        timerId = setInterval(() => { seconds++; updateTime(); }, 1000);
      }
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      pauseTimer();
      seconds = 0;
      updateTime();
    }
  </script>
</body>
</html>
